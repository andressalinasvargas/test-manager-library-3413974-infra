# Manager Library — infraestructura (T-20, RNF-5).
# Un solo comando:  docker compose up -d --build
# El motor arranca VACÍO: todo el DDL vive en las migraciones de la API (ADR-001, artículo V).
name: manager-library

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-library}
      POSTGRES_USER: ${POSTGRES_USER:-library}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [library-net]

  api:
    build:
      context: ${API_DIR:-../test-manager-library-3413974-api}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Define APP_KEY en .env}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-library}
      DB_USERNAME: ${POSTGRES_USER:-library}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Define ADMIN_USERNAME en .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      COVERS_DIR: /var/www/html/storage/app/covers
      PHP_CLI_SERVER_WORKERS: 8
    volumes:
      - covers:/var/www/html/storage/app/covers
    ports:
      - "${API_PORT:-8000}:8000"
    networks: [library-net]

  app:
    build:
      context: ${APP_DIR:-../test-manager-library-3413974-app}
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "${APP_PORT:-5173}:80"
    networks: [library-net]

volumes:
  db-data:
  covers:

networks:
  library-net:

